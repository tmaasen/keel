# Checks every pull request. No secrets and no deploys, so it is safe for contributions from forks.
name: Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Persona tests
        run: pnpm test
      - name: Build
        run: pnpm build
        env:
          VITE_CONVEX_URL: https://example.convex.cloud
